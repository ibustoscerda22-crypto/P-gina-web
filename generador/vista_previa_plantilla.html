<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vista previa paletizado</title>
<style>
  :root { --bg:#f4f5f7; --panel:#ffffff; --texto:#1c1f24; --suave:#5d6470; --borde:#d9dce1; --acento:#1f5fbf; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#15171a; --panel:#1f2226; --texto:#e8eaed; --suave:#a0a6b0; --borde:#34383e; --acento:#6ea0f0; }
  }
  :root[data-theme="dark"] { --bg:#15171a; --panel:#1f2226; --texto:#e8eaed; --suave:#a0a6b0; --borde:#34383e; --acento:#6ea0f0; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--texto);
    font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #escena { position:fixed; inset:0; }
  .panel { position:fixed; left:16px; right:16px; bottom:16px; max-width:560px; margin:0 auto;
    background:var(--panel); border:1px solid var(--borde); border-radius:10px; padding:12px 14px; }
  .panel h1 { font-size:15px; margin:0 0 2px; }
  .panel p { margin:0 0 8px; color:var(--suave); font-size:12.5px; }
  .fila { display:flex; gap:10px; align-items:center; }
  .fila input[type=range] { flex:1; accent-color:var(--acento); }
  button { background:var(--acento); color:#fff; border:0; border-radius:6px; padding:6px 12px; font:inherit; cursor:pointer; }
  #estado { font-variant-numeric:tabular-nums; min-width:130px; text-align:right; color:var(--suave); font-size:12.5px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="escena"></div>
<div class="panel">
  <h1 id="titulo"></h1>
  <p id="desc"></p>
  <div class="fila">
    <button id="play">▶ Simular apilado</button>
    <input id="slider" type="range" min="0" value="0" aria-label="Cajas colocadas">
    <span id="estado"></span>
  </div>
</div>
<script type="module">
/*__VISTA3D__*/

const D = /*__DATOS__*/null;
document.getElementById("titulo").textContent = `${D.nombre} — ${D.modelo}`;
document.getElementById("desc").textContent = D.descripcion;
const vista = crearVista(document.getElementById("escena"), (n, total, capa) => {
  document.getElementById("estado").textContent = `${n}/${total} cajas · capa ${capa}`;
});
const anim = controlesAnimacion(vista, document.getElementById("play"), document.getElementById("slider"));
vista.actualizar(D);
anim.reiniciar(D.places.length);
</script>
</body>
</html>
